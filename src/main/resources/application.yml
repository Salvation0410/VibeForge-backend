spring:
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yu_ai_code_mother
    username: root
    password: 123456
  application:
    name: yu-ai-code-mother-backend
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
      database: 1

  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
      # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yupi.yuaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    org.openqa.selenium.devtools.CdpVersionFinder: ERROR
    org.openqa.selenium.chromium.ChromiumDriver: ERROR

# AI 引擎：legacy 保持本地链路；langgraph 全量切换；gray 按白名单/比例切换。
ai:
  customer-service:
    enabled: ${AI_CUSTOMER_SERVICE_ENABLED:false}
    service-url: ${AI_CUSTOMER_SERVICE_SERVICE_URL:http://localhost:8000}
    timeout-seconds: ${AI_CUSTOMER_SERVICE_TIMEOUT_SECONDS:30}
    poll-interval-millis: ${AI_CUSTOMER_SERVICE_POLL_INTERVAL_MILLIS:5000}
    batch-size: ${AI_CUSTOMER_SERVICE_BATCH_SIZE:10}
    claim-timeout-seconds: ${AI_CUSTOMER_SERVICE_CLAIM_TIMEOUT_SECONDS:60}
    lease-timeout-seconds: ${AI_CUSTOMER_SERVICE_LEASE_TIMEOUT_SECONDS:45}
    retry-max: ${AI_CUSTOMER_SERVICE_RETRY_MAX:5}
    retry-base-delay-seconds: ${AI_CUSTOMER_SERVICE_RETRY_BASE_DELAY_SECONDS:5}
    max-response-bytes: ${AI_CUSTOMER_SERVICE_MAX_RESPONSE_BYTES:65536}
  html-artifact:
    enabled: ${AI_HTML_SMOKE_TEST_ENABLED:true}
    required: ${AI_HTML_SMOKE_TEST_REQUIRED:true}
    max-rewrite-source-chars: ${AI_HTML_MAX_REWRITE_SOURCE_CHARS:24000}
  engine: ${AI_ENGINE:legacy}
  service-url: ${AI_SERVICE_URL:http://localhost:8000}
  token: ${AI_SERVICE_INTERNAL_BEARER_TOKEN:}
  generation-stream-idle-timeout-seconds: ${AI_GENERATION_STREAM_IDLE_TIMEOUT_SECONDS:600}
  tool-idempotency-ttl-seconds: ${AI_TOOL_IDEMPOTENCY_TTL_SECONDS:86400}
  tool-idempotency-lock-wait-millis: ${AI_TOOL_IDEMPOTENCY_LOCK_WAIT_MILLIS:30000}
  gray-whitelist: []
  gray-percentage: 0

oss:
  knowledge-dir: ${OSS_KNOWLEDGE_DIR:customer-service-knowledge}
  max-knowledge-document-size: ${OSS_MAX_KNOWLEDGE_DOCUMENT_SIZE:20971520}
  knowledge-signed-url-ttl-seconds: ${OSS_KNOWLEDGE_SIGNED_URL_TTL_SECONDS:600}
