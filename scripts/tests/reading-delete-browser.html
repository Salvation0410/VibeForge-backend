<!doctype html><meta charset="UTF-8"><title>删除探针手写夹具</title>
<script type="module">
import { verifyReadingDeletion } from '/delete.mjs'
// 手写故障只验证探针，不充当自然 Vue 生成证据。
const results = []
for (const fault of ['none', 'view-only', 'stale-read', 'wrong-book']) {
  const frame = document.createElement('iframe'); document.body.append(frame)
  const d = frame.contentDocument
  d.body.innerHTML = '<h1>慢读书房</h1><input><button id="add">添加书籍</button><div id="filters"></div><p id="counts"></p><div id="books"></div>'
  const books = ['小王子', '人类简史', '三体'].map(title => ({ title, read: false }))
  let active = '全部', staleRead = 0
  const hidden = new Set()
  const render = () => {
    d.querySelector('#counts').textContent = '共 ' + books.length + ' 本 · 已读 ' + (books.filter(b => b.read).length + staleRead) + ' 本'
    const list = d.querySelector('#books'); list.replaceChildren()
    for (const book of books.filter(b => !hidden.has(b.title) && (active === '全部' || b.read === (active === '已读')))) {
      const item = d.createElement('div'), title = d.createElement('span'), toggle = d.createElement('button'), remove = d.createElement('button')
      title.textContent = book.title; toggle.textContent = book.read ? '标记未读' : '标记已读'; remove.textContent = '删除书籍'
      toggle.onclick = () => { book.read = !book.read; render() }
      remove.onclick = () => {
        if (fault === 'view-only') hidden.add(book.title)
        else {
          if (fault === 'stale-read' && book.read) staleRead++
          books.splice(fault === 'wrong-book' && !book.read ? books.length - 1 : books.indexOf(book), 1)
        }
        render()
      }
      item.append(title, toggle, remove); list.append(item)
    }
  }
  for (const name of ['全部', '未读', '已读']) {
    const b = d.createElement('button'); b.textContent = name
    b.onclick = () => { active = name; hidden.clear(); render() }; d.querySelector('#filters').append(b)
  }
  d.querySelector('#add').onclick = () => {
    const input = d.querySelector('input'), title = input.value.trim()
    if (title) { books.push({ title, read: false }); input.value = ''; render() }
  }
  render()
  const checks = []; let error = null
  try { await verifyReadingDeletion(d, { tick: () => new Promise(r => setTimeout(r, 0)), record: r => checks.push(r) }) }
  catch (e) { error = e.message }
  results.push({ fault, error, checks }); frame.remove()
}
await fetch('/report', { method: 'POST', body: JSON.stringify(results) })
document.body.textContent = '夹具完成'
</script>
