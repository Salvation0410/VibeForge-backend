<!doctype html><meta charset="UTF-8"><title>同名身份探针夹具</title>
<script type="module">
import { verifyReadingDuplicates } from '/duplicates.mjs'
// 故障只用于验证探针拒绝能力，不作为自然模型产物。
const results = []
for (const fault of ['none', 'title-all', 'view-index', 'title-first', 'stale-read', 'ambiguous']) {
  const frame = document.createElement('iframe'); document.body.append(frame)
  const d = frame.contentDocument
  d.body.innerHTML = '<input><button id="add">添加书籍</button><div id="filters"></div><p id="counts"></p><div id="books"></div>'
  let nextId = 4, active = '全部', stale = 0
  const books = ['小王子', '人类简史', '三体'].map((title, id) => ({ id: id + 1, title, read: false }))
  const render = () => {
    d.querySelector('#counts').textContent = `共 ${books.length} 本 · 已读 ${books.filter(b => b.read).length + stale} 本`
    const list = d.querySelector('#books'); list.replaceChildren()
    const visible = books.filter(b => active === '全部' || b.read === (active === '已读'))
    const append = (book, index) => {
      const card = d.createElement('section'), title = d.createElement('span'), status = d.createElement('button'), remove = d.createElement('button')
      title.textContent = '《' + book.title + '》'
      status.textContent = (book.read || (fault === 'ambiguous' && book.title === '同名验收书' && books.filter(b => b.title === book.title).length === 2)) ? '标记未读' : '标记已读'; remove.textContent = '删除书籍'
      status.onclick = () => { book.read = !book.read; render() }
      remove.onclick = () => {
        if (fault === 'stale-read' && book.read) stale++
        if (fault === 'title-all') { for (let i = books.length - 1; i >= 0; i--) if (books[i].title === book.title) books.splice(i, 1) }
        else books.splice(fault === 'view-index' ? index : fault === 'title-first' ? books.findIndex(b => b.title === book.title) : books.indexOf(book), 1)
        render()
      }
      card.append(title, status, remove); list.append(card)
    }
    visible.forEach(append)
  }
  for (const name of ['全部', '未读', '已读']) {
    const b = d.createElement('button'); b.textContent = name; b.onclick = () => { active = name; render() }; d.querySelector('#filters').append(b)
  }
  d.querySelector('#add').onclick = () => { const input = d.querySelector('input'); if (input.value.trim()) { books.push({ id: nextId++, title: input.value.trim(), read: false }); input.value = ''; render() } }
  render()
  const checks = []; let error = null
  try { await verifyReadingDuplicates(d, { tick: () => new Promise(r => setTimeout(r, 0)), record: r => checks.push(r) }) }
  catch (e) { error = e.message }
  results.push({ fault, error, checks }); frame.remove()
}
await fetch('/report', { method: 'POST', body: JSON.stringify(results) })
document.body.textContent = '夹具完成'
</script>
