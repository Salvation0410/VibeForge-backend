[project]
name = "yu-ai-service"
version = "0.1.0"
description = "LangGraph orchestration service for yu-ai-code-mother"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "langchain>=0.3,<0.4",
  "langchain-core>=0.3,<1",
  "langchain-openai>=0.3,<1",
  "langchain-text-splitters>=0.3,<0.4",
  "langgraph>=0.4,<1",
  "langsmith>=0.12,<1",
  "langgraph-checkpoint-postgres>=3.0.1,<3.1",
  "pymilvus>=2.5,<3",
  "FlagEmbedding==1.4.2",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "torch==2.6.0; sys_platform == 'win32'",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
